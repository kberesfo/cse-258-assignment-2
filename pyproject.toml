[project]
name = "assignment-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core numerics / ML
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "python-dateutil",
    "implicit",        # BPR (ch. 5)
    "scikit-surprise", # SVD latent factor model (ch. 5)
    "gensim",          # word2vec / item2vec (ch. 8)
    "nltk",            # PorterStemmer (ch. 8)
    # Notebook kernel for VS Code's Jupyter extension
    "ipykernel",
    "demjson3>=3.0.6",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.1",
    "ruff>=0.17.3",
]

[project.scripts]
assignment-2 = "assignment_2.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]

build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["assignment_2"]
