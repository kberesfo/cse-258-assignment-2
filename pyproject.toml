[project]
name = "assignment-2"
version = "0.1.0"
description = "CSE 258 Assignment 2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core numerics / ML
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "implicit==0.7.3", # BPR (ch. 5); pinned: the gpu extra's rmm pin only holds for 0.7.3
    "scikit-surprise", # bias / SVD latent factor models (ch. 5)
    # Notebook kernel for VS Code's Jupyter extension
    "ipykernel",
    "tqdm>=4.70.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyarrow>=26.0.1",           # parquet engine for the prepped cache
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.optional-dependencies]
gpu = ["rmm-cu13==26.04.*"]

[project.scripts]
assignment-2 = "assignment_2.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]

build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["assignment_2"]
